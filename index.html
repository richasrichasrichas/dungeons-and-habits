<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11130f">
  <title>Dungeons &amp; Habits — sua jornada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#inicio" aria-label="Dungeons and Habits - início">
        <span class="brand-mark">✦</span><span class="brand-name">Dungeons <i>&amp;</i><br>Habits</span>
      </a>
      <div class="sidebar-label">SUA JORNADA</div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-page="inicio"><span class="nav-icon">⌂</span>Início</button>
        <button class="nav-item" data-page="quests"><span class="nav-icon">▤</span>Quests <span id="quest-count" class="nav-count">0</span></button>
        <button class="nav-item" data-page="loja"><span class="nav-icon">◇</span>Loja</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-quote"><span class="quote-symbol">“</span><p>Grandes jornadas começam com pequenos passos.</p><span class="quote-rule"></span><small>— O Códice do Aventureiro</small></div>
      <button class="nav-item settings-link" data-page="configuracoes"><span class="nav-icon">⚙</span>Configurações</button>
      <div class="sidebar-profile"><div class="avatar" id="avatar-initial">A</div><div class="profile-copy"><strong id="side-username">Aventureiro</strong><span>O caminho é seu</span></div><span class="profile-dots">•••</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>O SEU REFÚGIO</span><span class="crumb-divider">/</span><strong id="page-title">Início</strong></div>
        <div class="topbar-actions"><span class="save-state"><i></i><span id="save-label">Progresso salvo</span></span><span class="top-divider"></span><button class="icon-button" id="refresh-button" title="Atualizar dados" aria-label="Atualizar">↻</button><button class="top-avatar" id="top-avatar">A</button></div>
      </header>
      <div id="toast" class="toast" role="status"></div>
      <section id="page-inicio" class="page active-page"></section>
      <section id="page-quests" class="page"></section>
      <section id="page-loja" class="page"></section>
      <section id="page-configuracoes" class="page"></section>
      <footer class="app-footer"><span>✦</span> Um passo de cada vez, aventureiro.</footer>
    </main>
  </div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
